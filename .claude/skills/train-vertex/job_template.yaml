# Vertex AI CustomJob spec for `gcloud ai custom-jobs create --config`.
# Verify field names against `gcloud help ai custom-jobs create` before use.
workerPoolSpecs:
  - machineSpec:
      machineType: g2-standard-8
      acceleratorType: NVIDIA_L4
      acceleratorCount: 1
    replicaCount: 1
    diskSpec:
      bootDiskType: pd-ssd
      bootDiskSizeGb: 200
    containerSpec:
      imageUri: us-central1-docker.pkg.dev/YIP_STAGING_PROJECT/yip/trainer:GIT_SHA
      command: ["python", "-m", "primer.story.train"]
      args: ["--config", "configs/story_lora.yaml", "--output", "gs://YIP_ARTIFACT_BUCKET/models/story/RUN_NAME"]
      env:
        - name: MLFLOW_EXPERIMENT_NAME
          value: yip-story
        - name: MLFLOW_TRACKING_URI
          value: https://YOUR-MLFLOW-SERVER
serviceAccount: yip-trainer@YIP_STAGING_PROJECT.iam.gserviceaccount.com
# Optional cost saver if the trainer resumes from GCS checkpoints:
# scheduling:
#   strategy: SPOT
