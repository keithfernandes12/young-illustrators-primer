# The pretrained drawing-recognition baseline (KAN-38, plan slice S6a): SigLIP 2's image tower
# scoring the 345 Quick, Draw! categories zero-shot. `model.py` reads this; nothing is trained yet,
# so `search_space` stays empty until S6d.
#
# `encoder_revision` is pinned so a rerun downloads exactly the weights a number was measured on.
# The base tower is deliberate, not a default: ~0.4B parameters loads and fine-tunes inside the 8 GB
# of VRAM a member's laptop has (AGENTS.md -> "Prefer a model that fine-tunes comfortably on one
# local GPU"), and the larger SigLIP 2 towers do not.
#
# `prompt_template`, `text_max_length` and `text_padding` are the settings the checkpoint was
# trained with, from its model card. They are here rather than in a call site because changing one
# changes every score: a measured `drawing_top5_acc` is only meaningful next to the prompt that
# produced it.
name: drawing-baseline
data_version: unpinned
encoder: google/siglip2-base-patch16-224
encoder_revision: 75de2d55ec2d0b4efc50b3e9ad70dba96a7b2fa2
encoder_license: apache-2.0
labels_file: quickdraw_categories.txt
prompt_template: "This is a photo of {label}."
text_max_length: 64
text_padding: max_length
top_k: 5
search_space: {}
