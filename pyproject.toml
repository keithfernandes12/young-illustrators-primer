[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "young-illustrators-primer"
version = "0.1.0"
description = "Young Illustrator's Primer: personalized storybooks from children's drawings (MLOps course project)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=15",
    "pyyaml>=6.0",
    "fsspec>=2024.2",
    "gcsfs>=2024.2",
    "datasets>=3.0",
    "openpyxl>=3.1",
    "rdata>=0.11",
    "fairlearn>=0.10",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.40"]
dvc = ["dvc[gs]>=3.50"]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
primer-data = "primer.data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
src = ["src"]

[tool.ruff.format]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
