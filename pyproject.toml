[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "young-illustrators-primer"
version = "0.1.0"
description = "Young Illustrator's Primer: personalized storybooks from children's drawings (MLOps course project)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=15",
    "pyyaml>=6.0",
    "fsspec>=2024.2",
    "gcsfs>=2024.2",
    "datasets>=3.0",
    "openpyxl>=3.1",
    "rdata>=0.11",
    "great_expectations>=1.0,<2",  # profiling.py uses the 1.x API (data_sources, batch definitions)
    "fairlearn>=0.15",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.40"]
dvc = ["dvc[gs]>=3.50"]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.10"]
# The drawing recogniser's weights. Deliberately not in `dependencies`: CI never installs torch,
# and `tests/drawing/` runs against a fake encoder instead. requirements.txt does not pin these --
# tests/test_requirements.py covers the dependencies, dev and dvc sets, which CI installs.
# `transformers>=5` because that is the API the encoder was written and run against: 5.x returns a
# `BaseModelOutputWithPooling` from `get_text_features`, where the model card's 4.x example shows a
# bare tensor. `model.pooled` handles both, but only the 5.x path has been exercised.
drawing = ["torch>=2.4", "transformers>=5.0,<6", "pillow>=10.0"]

[project.scripts]
primer-data = "primer.data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
src = ["src"]

[tool.ruff.format]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
