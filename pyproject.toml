[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "young-illustrators-primer"
version = "0.1.0"
description = "Young Illustrator's Primer: personalized storybooks from children's drawings (MLOps course project)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",  # imported directly by primer.drawing.render and primer.data; not only via pandas
    "pandas>=2.2",
    "pyarrow>=15",
    "pyyaml>=6.0",
    "fsspec>=2024.2",
    "gcsfs>=2024.2",
    "datasets>=3.0",
    "openpyxl>=3.1",
    "rdata>=0.11",
    "great_expectations>=1.0,<2",  # profiling.py uses the 1.x API (data_sources, batch definitions)
    "fairlearn>=0.15",
    "scikit-learn>=1.5",
    "pillow>=10.3",  # illustration: reading drawings and building the ControlNet control image
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.40"]
dvc = ["dvc[gs]>=3.50"]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.10"]
# The diffusion stack for illustration/model.py. Gigabytes with CUDA wheels, so CI does not install it:
# the tests use a fake pipeline, and only the smoke run and the GPU worker need the real one.
illustration = [
    "torch>=2.4",
    "diffusers>=0.30",
    "transformers>=5.0,<6",
    "accelerate>=0.33",
    "safetensors>=0.4",
]
# The drawing recogniser's weights. Deliberately not in `dependencies`: CI never installs torch,
# and `tests/drawing/` runs against a fake encoder instead. requirements.txt does not pin these --
# tests/test_requirements.py covers the dependencies, dev and dvc sets, which CI installs.
# `transformers>=5` because that is the API the encoder was written and run against: 5.x returns a
# `BaseModelOutputWithPooling` from `get_text_features`, where the model card's 4.x example shows a
# bare tensor. `model.pooled` handles both, but only the 5.x path has been exercised.
# `transformers` is pinned exactly (2026-11-24, the KAN-38 owner): every recorded drawing number --
# top-5 0.5436, S6c2's stability table, S6f's sensitivity -- was measured on 5.23.0, and a minor
# release can change outputs the way 4.x -> 5.x did. torch stays a floor: the CUDA build is
# installed separately (AGENTS.md -> Commands) and an extra cannot choose it.
drawing = ["torch>=2.4", "transformers==5.23.0", "mlflow>=2.14"]
# The character sheet (src/primer/drawing/sheet.py, S6e): `drawing`'s torch and transformers plus
# torchvision, which SAM 2's image processor imports. Separate from `drawing` so the recogniser
# alone does not need it. torchvision must be the same build as torch (CPU or CUDA) and an extra
# cannot choose a build, so this declares floors only (torchvision 0.19 pairs with torch 2.4);
# the local-GPU reinstall that matches the two is in AGENTS.md -> Commands. Not pinned in
# requirements.txt, for the same reason as `drawing`.
sheet = ["torch>=2.4", "transformers==5.23.0", "torchvision>=0.19"]
# Stage 6 character consistency: pretrained CLIP / DINOv2, and MLflow for the threshold experiment.
# The same torch floor as `drawing` and a 5.x transformers range (`drawing` pins 5.23.0 exactly
# for its recorded numbers; this experiment has no such pin yet). The 5.x `get_image_features`
# output is the path that has been run (embedders.py also accepts 4.x's bare tensor). Not pinned
# in requirements.txt, for the same reason as `drawing`.
consistency = ["torch>=2.4", "transformers>=5.0,<6", "mlflow>=2.14"]
# Story generation (src/primer/story): small pretrained instruct models on the member's Mac (MPS), the
# grid's MLflow runs and its comparison charts. Not needed for tests, which drive the writer with a stub
# model; CI does not install it. Same torch floor as `drawing`, with transformers in 5.x
# (`drawing` pins 5.23.0 for its recorded numbers).
story = ["torch>=2.4", "transformers>=5.0,<6", "mlflow>=2.14", "matplotlib>=3.8"]
# Read-aloud ASR (src/primer/speech). Not needed for tests, which never load weights.
speech = ["torch>=2.4", "transformers>=5.0,<6", "soundfile>=0.12", "mlflow>=2.14", "matplotlib>=3.8"]

[project.scripts]
primer-data = "primer.data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# `primer.drawing.render` loads its settings with `Path(__file__).parent / "configs"`, and every
# other area ships a `configs/` YAML waiting for the same treatment. An editable install and the
# area Dockerfiles satisfy that, but a built wheel would not: without this the YAML is left out of
# the distribution and the first call raises FileNotFoundError. The `*.txt` glob is for the
# vocabulary file S6a adds alongside.
[tool.setuptools.package-data]
"*" = ["configs/*.yaml", "configs/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
src = ["src"]

[tool.ruff.format]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
